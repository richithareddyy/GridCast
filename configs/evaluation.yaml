# All boundaries refer to interval START in UTC, with exclusive end bounds.
experiment_version: 4
status: milestone_4_frozen_reliability_protocol
dataset: eia930_isne
target: demand_mw
units: MW
frequency: 1h
timezone: UTC
calendar_timezone: America/New_York
forecast:
  task: next_24_hour_path
  horizon_hours: 24
  origin_hour_utc: 0
  origin_stride_hours: 24
  label: average demand during [origin+h-1h, origin+h) for h=1..24
  assumed_reporting_delay_hours: 1
  available_demand: interval_end <= origin - 1h
  available_weather: weather_hour_end <= origin - 1h
  vintage: retrospective_latest_revised_not_as_published
  future_observed_weather: excluded_from_primary_comparison
  conditional_weather_experiment: optional_separate_realized_weather_upper_information_benchmark
periods:
  train: {start: '2020-01-01T00:00:00Z', end: '2023-01-01T00:00:00Z'}
  validation: {start: '2023-01-01T00:00:00Z', end: '2023-10-01T00:00:00Z'}
  calibration: {start: '2023-10-01T00:00:00Z', end: '2024-01-01T00:00:00Z'}
  test: {start: '2024-01-01T00:00:00Z', end: '2025-01-01T00:00:00Z'}
eda: {partition: train, test_access: schema_and_quality_checks_only}
backtesting:
  scheme: expanding_window
  folds: monthly_validation_blocks
  refit_frequency: month_start
  prediction_frequency: daily_00_UTC
  all_training_labels_must_end_by: origin_minus_reporting_delay
  final_model_selection: validation_only_before_calibration_and_test
  final_test_refits: monthly_with_fixed_hyperparameters_and_only_matured_labels
  store: every_origin_horizon_model_actual_prediction_and_fold
baselines:
  naive: last_available_observation_repeated_24_times
  daily: target_end_minus_24h_if_available_otherwise_minus_48h
  daily_latency_note: final_horizon_uses_48h_lag_because_24h_lag_not_yet_published
  weekly: target_end_minus_168h
  seasonal_lag_clock: elapsed_UTC_hours_not_local_clock_day
metrics: [MAE, RMSE, WAPE, MASE]
mase: {seasonal_lag_hours: 168, scale_fit: each_fold_training_only}
conditions:
  peak: local_interval_start_hour_16_to_20_inclusive
  holiday: US_federal_calendar_actual_and_observed_dates
  extremes: {quantile: 0.95, fitted_on: initial_training_demand, fixed_across_models: true}
  extreme_temperature: {lower_quantile: 0.05, upper_quantile: 0.95, fitted_on: initial_training_weather}
  seasons: {winter: [12, 1, 2], spring: [3, 4, 5], summer: [6, 7, 8], autumn: [9, 10, 11]}
uncertainty:
  levels: [0.50, 0.80, 0.95]
  method: rolling_past_out_of_sample_absolute_residual_quantiles_by_horizon
  enabled: true
  rank: ceil_n_plus_1_times_nominal_coverage
  minimum_samples_per_horizon: 30
  anomaly_level: 0.95
  monitor_window_days: 30
  monitor_minimum_hours: 168
  deployment_rounds: median_validation_selected_tree_counts_fixed_before_reserved_outcomes
  fail_on_insufficient_history: true
  initial_calibration_partition: calibration
  rolling_window_days: 90
  updates: only_after_actuals_available_at_origin
  evaluation: coverage_width_and_interval_score_overall_and_by_condition
  caveat: serial_dependence_and_drift_preclude_IID_distribution_free_coverage_claims
comparison:
  test: paired_daily_MAE_differences_with_HAC
  reference: daily_seasonal_naive_predeclared
  interval: pointwise_asymptotic_95_percent
  scope: exploratory_validation_not_adjusted_for_model_selection
  block_days: 7
  uncertainty_resamples: 2000
  multiplicity: Holm_adjustment_for_multiple_model_comparisons
random_seeds: {numpy: 42, boosting: 42, deep_learning: 42}

statistical_model:
  name: dhr_ar1
  estimator: statsmodels_GLSAR_iterative_feasible_GLS
  daily_fourier_order: 3
  weekly_fourier_order: 3
  annual_fourier_order: 3
  weekend_daily_interactions: true
  holiday: true
  linear_trend_reference: '2020-01-01T00:00:00Z'
  ar_order: 1
  max_iterations: 50
  relative_tolerance: 0.000001
  future_weather: none
  tuning: none_in_milestone_2
features:
  historical_lags: [1, 24, 48, 168]
  lag_1_definition: last_available_observation_at_origin_not_target_minus_1
  unavailable_target_lag: null_with_explicit_availability_flag
  rolling_windows_hours: [24, 168]
  rolling_cutoff: last_available_hour_at_origin
  rolling_missing_policy: require_complete_window
  weather: excluded_from_primary_predictors

learning:
  seed: 42
  lookback_hours: 168
  reporting_delay_hours: 1
  target: residual_from_available_daily_seasonal_baseline
  strategy: shared_model_direct_24_hour_path
  training_origins: daily_00_UTC_with_all_24_labels_published_by_fit_origin
  inner_stopping_days: 60
  stopping_split: last_60_available_training_origins_with_label_maturity_purge
  refit: fresh_full_available_training_fit_at_selected_rounds_or_epochs
  lightgbm:
    max_rounds: 600
    patience: 40
    parameters:
      objective: regression
      metric: l1
      learning_rate: 0.03
      num_leaves: 15
      min_data_in_leaf: 80
      lambda_l2: 1.0
      feature_fraction: 1.0
      bagging_fraction: 1.0
      num_threads: 1
      deterministic: true
      force_col_wise: true
      verbosity: -1
  lstm:
    hidden_size: 16
    max_epochs: 40
    patience: 6
    batch_size: 64
    learning_rate: 0.001
    weight_decay: 0.0001
    gradient_clip: 1.0
    device: cpu
    sequence: last_168_available_hourly_demand_values
    decoder: shared_MLP_with_known_calendar_daily_and_weekly_templates
    normalization: mean_std_of_training_sequence_inputs_only
    selection_metric: inner_stopping_MAE
    training_loss: MSE
