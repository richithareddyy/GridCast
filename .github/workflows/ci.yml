name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Install Python and smoke-test native runtimes
        run: |
          uv python install 3.12.15
          make setup VENV_PYTHON="$(uv python find 3.12.15)"
      - name: Check dependency compatibility
        run: .venv/bin/python -m pip check
      - name: Lint
        run: make lint
      - name: Test temporal contracts, models and offline reporting
        run: make test
      - name: Verify saved research evidence and README
        run: make verify
      - name: Rebuild reports without fitting models
        run: make report
      - name: Check numerical results remain unchanged
        run: git diff --exit-code -- README.md reports/tables reports/results
