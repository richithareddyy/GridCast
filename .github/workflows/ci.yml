name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install and smoke-test native runtimes
        run: make setup
      - name: Check dependency compatibility
        run: .venv/bin/python -m pip check
      - name: Lint
        run: make lint
      - name: Test temporal contracts, models and offline reporting
        run: make test
      - name: Verify saved research evidence and README
        run: make verify
      - name: Rebuild reports without fitting models
        run: make report
      - name: Check numerical results remain unchanged
        run: git diff --exit-code -- README.md reports/tables reports/results
